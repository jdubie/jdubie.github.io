[project]
name = "yamtrack"
version = "0.1.0"
description = "RL environment: a coding agent writes a controller that tracks trajectories on a YAM arm with hidden dynamics."
requires-python = ">=3.11,<3.13"
dependencies = [
    "matplotlib>=3.11.2",
    "mujoco",
    "numpy",
    "pillow",
    "pyarrow>=26.0.1",
    "scipy",
]

[tool.uv]
package = false
